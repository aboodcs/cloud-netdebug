apiVersion: networking.k8s.io/v1
kind: NetworkPolicy

metadata:
  name: {{ .Values.networkPolicy.name | quote }}
  namespace: {{ .Values.namespace.name | quote }}

spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.podLabels | nindent 6 }}

  policyTypes:
    - Ingress

  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.allowedPodLabels | nindent 14 }}